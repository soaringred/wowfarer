nodeLinker: node-modules

# Upstream packaging bug: @astrojs/astro2tsx (used by astro check) loads
# @napi-rs/wasm-runtime, whose peer @emnapi/runtime it never declares, so Yarn
# leaves it out and astro check reports itself "not installed". Drop this once
# astro2tsx lists the dependency itself.
packageExtensions:
  "@astrojs/astro2tsx@*":
    dependencies:
      "@emnapi/runtime": "1.11.3"
